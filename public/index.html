<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bed Wars Online</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2b1a;--fg:#f3f0e2;--panel:rgba(20,28,18,.86)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:'Silkscreen',ui-monospace,Menlo,monospace}
canvas{display:block;width:100%;height:100%}
#cross{position:fixed;left:50%;top:50%;width:18px;height:18px;margin:-9px;pointer-events:none;mix-blend-mode:difference;transition:transform .08s}
#cross:before,#cross:after{content:"";position:absolute;background:#fff}
#cross:before{left:8px;top:0;width:2px;height:18px}#cross:after{top:8px;left:0;height:2px;width:18px}
#bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:4px;background:var(--panel);border:2px solid #000}
.s{width:46px;height:46px;border:3px solid #555;position:relative;cursor:pointer}.s.on{border-color:var(--fg);transform:translateY(-4px)}
.s i{position:absolute;left:6px;right:6px;top:6px;bottom:6px}.s b{position:absolute;right:2px;bottom:0;font-size:12px;text-shadow:1px 1px #000}
.s em{position:absolute;left:2px;top:0;font-size:9px;font-style:normal;text-shadow:1px 1px #000}
.hud{position:fixed;font-size:12px;text-shadow:1px 1px #000;line-height:1.6;background:var(--panel);padding:8px 10px}
#tm{top:10px;left:10px}#res{top:10px;right:10px;text-align:right}#hp{bottom:14px;left:10px}
.ri{width:20px;height:20px;image-rendering:pixelated;vertical-align:middle;margin-right:5px;object-fit:contain}
.shopri{width:22px;height:22px;image-rendering:pixelated;vertical-align:middle;margin-right:8px;object-fit:contain}
#msg{position:fixed;top:22%;left:50%;transform:translateX(-50%);font-size:18px;text-shadow:2px 2px #000;pointer-events:none;text-align:center}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,18,8,.7);z-index:20}
.ov>div{width:min(440px,90vw);max-height:88vh;overflow:auto;padding:26px;background:var(--panel);border:3px solid var(--fg);line-height:1.7;font-size:13px}
.ov h1{margin:0 0 10px;font-size:24px}.ov p{margin:5px 0}
button{font:inherit;font-size:12px;color:var(--fg);background:#2f4a2a;border:2px solid var(--fg);padding:6px 10px;margin:3px 0;cursor:pointer;display:block;width:100%;text-align:left}
button:hover{background:#456b3d}
input{font:inherit;width:100%;box-sizing:border-box;padding:6px;background:#0d150c;color:var(--fg);border:2px solid var(--fg)}
#bar{max-width:92vw;overflow-x:auto;scrollbar-width:none;z-index:10}.s{flex:0 0 auto}
#breakBox{position:fixed;left:50%;top:58%;transform:translateX(-50%);width:180px;height:12px;border:2px solid #000;background:#222;display:none;z-index:4}#breakFill{height:100%;width:0;background:#eee}
#shopTabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}#shopTabs button{width:auto}
#mobile{display:none;position:fixed;inset:0;pointer-events:none;z-index:8}
#joy{position:absolute;left:18px;bottom:24px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.5);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:42px;top:42px;width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.55)}
#look{position:absolute;right:0;top:0;width:55%;height:100%;pointer-events:auto;touch-action:none}
.mb{position:absolute;width:72px;height:54px;border-radius:12px!important;text-align:center!important;padding:0!important;background:rgba(20,28,18,.7)!important;pointer-events:auto!important;touch-action:none}
#jumpBtn{right:18px;bottom:88px}#actBtn{right:98px;bottom:28px}#useBtn{right:18px;bottom:28px}#shopBtn{right:178px;bottom:28px}
@media (pointer:coarse),(max-width:800px){#mobile{display:block}.hud{font-size:10px;padding:5px 7px}#tm{max-width:38vw}#res{max-width:32vw}.s{width:38px;height:38px}.s em{font-size:8px}.s b{font-size:10px}#bar{bottom:8px;max-width:54vw}.ov>div{width:min(520px,94vw);padding:16px}.ov h1{font-size:20px}}
</style></head><body>
<div id="cross"></div><div id="msg"></div><div id="bar"></div><div id="breakBox"><div id="breakFill"></div></div>
<div id="mobile"><div id="joy"><div id="knob"></div></div><div id="look"></div><button class="mb" id="jumpBtn">PULAR</button><button class="mb" id="actBtn">ATACAR</button><button class="mb" id="useBtn">USAR</button><button class="mb" id="shopBtn">LOJA</button></div>
<div class="hud" id="tm"></div><div class="hud" id="res"></div><div class="hud" id="hp"></div>
<div class="ov" id="menu" style="display:flex"><div><h1>Bed Wars Online</h1>
<p>Seu nome</p><input id="nm" maxlength="14" value="Jogador">
<p>Código da sala (todos digitam o mesmo)</p><input id="rm" maxlength="12" value="sala1">
<button id="go" style="text-align:center;margin-top:12px">Entrar</button><p id="er"></p></div></div>
<div class="ov" id="lobby"><div><h1>Sala <span id="rc"></span></h1><div id="pl"></div>
<button id="st" style="display:none;text-align:center;margin-top:10px">Iniciar partida</button><p id="wt"></p></div></div>
<div class="ov" id="ov"><div><h1>Pronto?</h1>
<p>WASD anda · Espaço pula · Shift agacha</p><p>Esquerdo bate ou quebra · direito usa o item</p>
<p>1–9 ou roda do mouse troca o item · B abre a loja</p>
<p>Cada clique é um golpe. Golpe caindo = crítico.</p><p><b>Clique para jogar</b></p></div></div>
<div class="ov" id="shop"><div><h1>Loja</h1><div id="shopTabs"></div><div id="sl"></div><button onclick="closeShop()">Fechar (B)</button></div></div>
<div class="ov" id="end"><div><h1 id="et"></h1><button onclick="location.reload()">Jogar de novo</button></div></div>
