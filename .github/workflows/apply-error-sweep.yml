name: Apply Error Sweep
on:
  push:
    branches: [audit/error-sweep-20261005]
    paths:
      - '.github/scripts/apply-error-sweep.js'
      - '.github/workflows/apply-error-sweep.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/error-sweep-20261005
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fixes
        run: node .github/scripts/apply-error-sweep.js
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/shared.js
          node --check public/blockbench-models.js
          node --check public/game.js
      - name: Validate fixes
        run: |
          grep -q 'safePlayerName' server.js
          grep -q 'getStaticFile' server.js
          grep -q 'sendSocket(q.ws,data)' server.js
          ! grep -q 'canSend(q.ws)' server.js
          grep -q 'document.createTextNode' public/game.js
          grep -q 'Check stability regressions' .github/workflows/check.yml
      - name: Publish functional changes through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const owner='lordmister65',repo='BEDwars',branch='audit/error-sweep-20261005';
          const files=['server.js','public/game.js','.github/workflows/check.yml'];
          const headers={Authorization:`Bearer ${process.env.GH_TOKEN}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function api(url,opt={}){for(let n=1;n<=5;n++){const r=await fetch(url,{...opt,headers:{...headers,...(opt.headers||{})}});if(r.ok)return r;const t=await r.text();console.error('GitHub API attempt',n,r.status,t.slice(0,300));if(n===5)throw new Error('GitHub API failed: '+r.status);await new Promise(s=>setTimeout(s,n*2500));}}
          (async()=>{
            for(const path of files){
              const enc=encodeURIComponent(path).replace(/%2F/g,'/');
              const meta=await (await api(`https://api.github.com/repos/${owner}/${repo}/contents/${enc}?ref=${encodeURIComponent(branch)}`)).json();
              const body={message:'Fix runtime and static asset stability issues',content:Buffer.from(fs.readFileSync(path)).toString('base64'),sha:meta.sha,branch};
              await api(`https://api.github.com/repos/${owner}/${repo}/contents/${enc}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
              console.log('Published',path);
            }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
