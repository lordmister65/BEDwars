name: Apply admin spectator mode
on:
  push:
    branches: [ feature/admin-spectator-mode ]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-spectator-mode
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-admin-mode.js
      - run: node --check server.js
      - run: node --check public/game.js
      - name: Commit generated admin changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/game.js public/style.css
          git diff --cached --quiet || git commit -m "Add hidden admin spectator creative mode"
          git push origin HEAD:feature/admin-spectator-mode
