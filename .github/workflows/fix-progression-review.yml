name: Fix Progression Review
on:
  push:
    branches: [ feature/progression-chests-compass ]
    paths:
      - '.github/scripts/fix-progression-review.js'
      - '.github/workflows/fix-progression-review.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progression-chests-compass
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply review fixes
        run: node .github/scripts/fix-progression-review.js
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/game.js
      - name: Commit review fixes
        run: |
          git config user.name lordmister65
          git config user.email actions@users.noreply.github.com
          git add server.js public/game.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix progression privacy and chest UI"
            git push
          fi
