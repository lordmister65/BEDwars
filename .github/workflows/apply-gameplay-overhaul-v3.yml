name: Apply Gameplay Overhaul V3
on:
  push:
    branches: [feature/gameplay-overhaul-v3]
    paths:
      - '.github/scripts/apply-gameplay-overhaul-v3.js'
      - '.github/workflows/apply-gameplay-overhaul-v3.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gameplay-overhaul-v3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply gameplay overhaul
        run: node .github/scripts/apply-gameplay-overhaul-v3.js
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/game.js public/index.html public/style.css
          git diff --cached --quiet || git commit -m "Gameplay overhaul V3"
          git push origin HEAD:feature/gameplay-overhaul-v3