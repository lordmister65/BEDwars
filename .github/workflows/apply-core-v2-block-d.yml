name: Apply Core V2 Block D
on:
  push:
    branches: [feature/core-v2-block-d]
    paths:
      - '.github/scripts/apply-core-v2-block-d.js'
      - '.github/workflows/apply-core-v2-block-d.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/core-v2-block-d
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Core V2 block D
        run: node .github/scripts/apply-core-v2-block-d.js
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check public/game.js
      - name: Validate Core V2 block D
        run: |
          grep -q 'function showEventBanner' public/game.js
          grep -q 'function renderMatchStatus' public/game.js
          grep -q "SUA CAMA FOI DESTRUÍDA" public/game.js
          grep -q 'eventBanner' public/index.html
          grep -q 'matchStatus' public/index.html
          grep -q 'Game Feel V2 + HUD V2' public/style.css
          grep -q 'core-v2-block-d-20261009' public/index.html
          grep -q 'game-feel-v2-20261009' public/index.html
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/game.js public/index.html public/style.css
          git diff --cached --quiet || git commit -m 'Implement Game Feel V2 and HUD V2'
          git push origin HEAD:feature/core-v2-block-d
