name: Apply Match Party HUD Modes V2
on:
  push:
    branches: [feature/match-party-hud-modes-v2]
    paths:
      - '.github/scripts/apply-match-party-hud-modes-v2.py'
      - '.github/workflows/apply-match-party-hud-modes-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/match-party-hud-modes-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply V2 migration
        run: python3 .github/scripts/apply-match-party-hud-modes-v2.py
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/game.js
      - name: Validate features
        run: |
          grep -q "'1v1':" server.js
          grep -q "'3v3':" server.js
          grep -q 'QUICK_MATCH_CONFIG' server.js
          grep -q 'updateQuickCountdown' server.js
          grep -q "case 'mapVote'" server.js
          grep -q "case 'party'" server.js
          grep -q 'mapVoteSummary' server.js
          grep -q 'partyMate' public/game.js
          grep -q 'copyPartyCode' public/game.js
          grep -q 'next-event' public/game.js
          grep -q 'Duelo 1v1' public/index.html
          grep -q 'partyStatus' public/index.html
          grep -q 'Matchmaking / Party V2' public/style.css
          grep -q 'match-party-hud-modes-v2-20261009' public/index.html
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/game.js public/index.html public/style.css
          git diff --cached --quiet || git commit -m 'Improve matchmaking party HUD and modes'
          git push origin HEAD:feature/match-party-hud-modes-v2
