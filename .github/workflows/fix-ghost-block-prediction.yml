name: Fix Ghost Block Prediction
on:
  push:
    branches: [fix/ghost-block-prediction]
    paths:
      - '.github/scripts/fix-ghost-block-prediction.js'
      - '.github/workflows/fix-ghost-block-prediction.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ghost-block-prediction
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply fix
        run: node .github/scripts/fix-ghost-block-prediction.js
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/game.js public/index.html
          git diff --cached --quiet || git commit -m "Fix ghost block prediction"
          git push origin HEAD:fix/ghost-block-prediction
