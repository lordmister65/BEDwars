name: Apply Hitbox V2
on:
  push:
    branches: [fix/improve-combat-hitbox]
    paths:
      - '.github/scripts/apply-hitbox-v2.js'
      - '.github/workflows/apply-hitbox-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/improve-combat-hitbox
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply hitbox migration
        run: node .github/scripts/apply-hitbox-v2.js
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/game.js public/index.html
          git diff --cached --quiet || git commit -m "Improve combat hitboxes"
          git push origin HEAD:fix/improve-combat-hitbox
