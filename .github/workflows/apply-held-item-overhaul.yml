name: Apply held item overhaul
on:
  push:
    branches: [ feature/item-view-and-models ]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/item-view-and-models
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/improve-held-items.js
      - run: node --check public/game.js
      - name: Commit generated item visuals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game.js
          git diff --cached --quiet || git commit -m "Improve first-person item positions and voxel models"
          git push origin HEAD:feature/item-view-and-models
