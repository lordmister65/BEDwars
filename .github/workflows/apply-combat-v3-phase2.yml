name: Apply Combat V3 Phase 2
on:
  push:
    branches: [feature/combat-v3-phase2]
    paths:
      - '.github/scripts/apply-combat-v3-phase2.js'
      - '.github/workflows/apply-combat-v3-phase2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/combat-v3-phase2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Combat V3 phase 2
        run: node .github/scripts/apply-combat-v3-phase2.js
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/game.js
      - name: Validate Combat V3 phase 2
        run: |
          grep -q 'HISTORY_BUFFER_MS:600' server.js
          grep -q 'MAX_REWIND_MS:250' server.js
          grep -q 'NOMINAL_REACH:3.55' server.js
          grep -q 'HARD_REACH_LIMIT:4.00' server.js
          grep -q 'rewoundMeleeTarget' server.js
          grep -q 'recordCombatHistory' server.js
          grep -q 'combatClockOffsetMs' public/game.js
          grep -q 'combat-v3-phase2-20261008' public/index.html
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/game.js public/index.html
          git diff --cached --quiet || git commit -m 'Implement Combat V3 phase 2 rewind and precise melee validation'
          git push origin HEAD:feature/combat-v3-phase2
