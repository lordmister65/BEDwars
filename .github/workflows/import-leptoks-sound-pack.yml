name: Import Leptoks Sound Pack
on:
  push:
    branches: [feature/leptoks-sound-pack]
    paths:
      - '.github/scripts/import-leptoks-sound-pack.js'
      - '.github/workflows/import-leptoks-sound-pack.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/leptoks-sound-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download exact public copy of supplied pack
        run: |
          set -euo pipefail
          PAGE='https://www.mediafire.com/file/digqfj1fl3yn2d5/%21_%C2%A72Leptoks_Sound_Pack_%5BOverlay%5D.zip/file'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/mediafire.html "$PAGE"
          DIRECT=$(python - <<'PY'
          import re,html
          s=open('/tmp/mediafire.html',encoding='utf-8',errors='ignore').read()
          pats=[r'id="downloadButton"[^>]+href="([^"]+)"',r'href="([^"]+)"[^>]+id="downloadButton"']
          u=''
          for p in pats:
              m=re.search(p,s,re.I)
              if m: u=html.unescape(m.group(1));break
          if not u: raise SystemExit('MediaFire direct download link not found')
          print(u)
          PY
          )
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -o /tmp/leptoks.zip "$DIRECT"
          echo '5f2b5e578ee392f62794a7c743728d07d16407788fc54482672d1a6c5867ebc6  /tmp/leptoks.zip' | sha256sum -c -
      - name: Import audio assets
        run: |
          set -euo pipefail
          rm -rf /tmp/leptoks public/assets/sounds/leptoks
          mkdir -p /tmp/leptoks public/assets/sounds/leptoks
          unzip -q /tmp/leptoks.zip -d /tmp/leptoks
          cp -R /tmp/leptoks/assets/minecraft/sounds/. public/assets/sounds/leptoks/
          find public/assets/sounds/leptoks -type f -name '*.sfk' -delete
          cp /tmp/leptoks/pack.mcmeta public/assets/sounds/leptoks/pack.mcmeta
          cat > public/assets/sounds/leptoks/CREDITS.txt <<'EOF'
          Leptok's Sound Pack [Overlay]
          Creator: Leptok
          Source: official Leptok release / Resourcepacks24
          Resource page: https://resourcepacks24.de/resourcepack/337475
          Integrated into Browser BedWars from the sound pack supplied by the project owner.
          The creator's pack description requests proper credit when using these sounds.
          EOF
      - name: Adapt migration to current sfx3d syntax
        run: |
          python - <<'PY'
          p='.github/scripts/import-leptoks-sound-pack.js'
          s=open(p,encoding='utf-8').read()
          old="/case'sfx3d':\\{const g=positionalGain\\(m\\.x,m\\.y,m\\.z,m\\.r\\|\\|7\\);if\\(g>0\\)\\{[\\s\\S]*?\\}\\}break;/"
          new="/case'sfx3d':\\{const g=positionalGain\\(m\\.x,m\\.y,m\\.z,m\\.r\\|\\|7\\);if\\(g>0\\)\\{[\\s\\S]*?\\}break\\}/"
          if old not in s: raise SystemExit('old sfx3d matcher not found')
          open(p,'w',encoding='utf-8').write(s.replace(old,new))
          PY
      - name: Patch BedWars audio integration
        run: node .github/scripts/import-leptoks-sound-pack.js
      - name: Fix generated sfx3d case closure
        run: |
          python - <<'PY'
          p='public/game.js'
          s=open(p,encoding='utf-8').read()
          old="else sfx(m.k)}break;\ncase'fx':"
          new="else sfx(m.k)}break;}\ncase'fx':"
          if old not in s: raise SystemExit('generated sfx3d closure not found')
          open(p,'w',encoding='utf-8').write(s.replace(old,new,1))
          PY
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Verify imported sound count
        run: |
          test "$(find public/assets/sounds/leptoks -type f -name '*.ogg' | wc -l)" -eq 24
          test -f public/assets/sounds/leptoks/dig/cloth1.ogg
          test -f public/assets/sounds/leptoks/random/click.ogg
          test -f public/assets/sounds/leptoks/ambient/weather/rain1.ogg
          test -f public/assets/sounds/leptoks/mob/wolf/bark1.ogg
      - name: Commit imported sound pack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/game.js public/index.html public/assets/sounds/leptoks
          git diff --cached --quiet || git commit -m 'Integrate Leptoks sound pack'
          git push origin HEAD:feature/leptoks-sound-pack
