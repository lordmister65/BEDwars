name: Apply Generator Economy
on:
  push:
    branches: [feature/base-generator-upgrades]
    paths:
      - '.github/scripts/apply-generator-economy.js'
      - '.github/workflows/apply-generator-economy.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/base-generator-upgrades
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node .github/scripts/apply-generator-economy.js
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/game.js public/shared.js public/style.css
          git diff --cached --quiet || git commit -m "Add chest-based generator progression"
          git push origin HEAD:feature/base-generator-upgrades