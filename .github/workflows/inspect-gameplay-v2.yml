name: Inspect Gameplay V2
on:
  push:
    branches: [feature/gameplay-v2]
    paths:
      - '.github/scripts/inspect-gameplay-v2.js'
      - '.github/workflows/inspect-gameplay-v2.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gameplay-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/inspect-gameplay-v2.js
