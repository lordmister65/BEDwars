name: Check Bedwars
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check public/shared.js
          node --check public/blockbench-models.js
          node --check public/game.js
      - name: Check runtime state declarations
        run: |
          grep -q "currentMode='2v2'" public/game.js
          grep -q "drawShop();" public/game.js

      - name: Check referenced client assets
        run: |
          grep -q '/style.css' public/index.html
          grep -q '/blockbench-models.js' public/index.html
          grep -q '/game.js' public/index.html
          test -f public/assets/kai_hive_bedwars_atlas.png
          grep -q '/assets/kai_hive_bedwars_atlas.png' public/game.js
