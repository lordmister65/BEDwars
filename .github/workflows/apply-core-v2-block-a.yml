name: Apply Core V2 Block A
on:
  push:
    branches: [feature/core-v2-block-a]
    paths:
      - '.github/scripts/apply-core-v2-block-a.js'
      - '.github/workflows/apply-core-v2-block-a.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/core-v2-block-a
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Core V2 block A
        run: node .github/scripts/apply-core-v2-block-a.js
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/game.js
      - name: Validate Core V2 block A
        run: |
          grep -q 'SERVER_TICK_HZ=30' server.js
          grep -q 'SNAPSHOT_HZ=15' server.js
          grep -q 'MOVEMENT_CONFIG' server.js
          grep -q 'inspectMovementPacket' server.js
          grep -q 'sendKnockback' server.js
          grep -q 'serverMetricsSnapshot' server.js
          grep -q "seq:++R.netSeq" server.js
          grep -q 'moveSeq' public/game.js
          grep -q 'serverTickMs' public/game.js
          grep -q 'lastSnapshotSeq' public/game.js
          grep -q 'core-v2-block-a-20261009' public/index.html
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/game.js public/index.html
          git diff --cached --quiet || git commit -m 'Implement Core V2 movement tick networking and observability'
          git push origin HEAD:feature/core-v2-block-a
