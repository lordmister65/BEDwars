name: Apply Combat V3 Phase 4
on:
  push:
    branches: [feature/combat-v3-phase4]
    paths:
      - '.github/scripts/apply-combat-v3-phase4.js'
      - '.github/workflows/apply-combat-v3-phase4.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/combat-v3-phase4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Combat V3 phase 4
        run: node .github/scripts/apply-combat-v3-phase4.js
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/game.js
      - name: Validate Combat V3 phase 4
        run: |
          grep -q 'CLICK_SAMPLE_MAX:120' server.js
          grep -q 'CLICK_ANALYZE_MIN:50' server.js
          grep -q 'CLICK_FLAG_SCORE:12' server.js
          grep -q 'clickPatternEntropy' server.js
          grep -q 'analyzeCombatClicks' server.js
          grep -q 'registerCombatClick' server.js
          grep -q 'autoclick:0' server.js
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git diff --cached --quiet || git commit -m 'Implement Combat V3 phase 4 autoclick telemetry'
          git push origin HEAD:feature/combat-v3-phase4
