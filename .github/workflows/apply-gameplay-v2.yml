name: Apply Gameplay V2
on:
  push:
    branches: [feature/gameplay-v2]
    paths:
      - '.github/scripts/apply-gameplay-v2.js'
      - '.github/workflows/apply-gameplay-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gameplay-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Gameplay V2
        run: node .github/scripts/apply-gameplay-v2.js
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Verify Gameplay V2 hooks
        run: |
          grep -q 'centralGenCfg' server.js
          grep -q 'envIh' server.js
          grep -q 'projectileHit' public/game.js
          grep -q 'comboHud' public/index.html
          grep -q 'placeRejected' public/game.js
          grep -q 'Nasce em' public/game.js
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/game.js public/index.html public/style.css
          git diff --cached --quiet || git commit -m 'Implement Gameplay V2 combat projectiles blocks and generators'
          git push origin HEAD:feature/gameplay-v2
# gameplay-v2 migration trigger
