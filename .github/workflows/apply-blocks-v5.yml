name: Apply Blocks V5
on:
  push:
    branches: [feature/blocks-v5-bridge-rewind]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/blocks-v5-bridge-rewind
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 .github/scripts/apply-blocks-v5.py
      - run: npm ci
      - run: node --check server.js && node --check public/game.js
      - run: grep -q 'PLACEMENT_V5' server.js && grep -q "case 'placeBatch'" server.js && grep -q 'processPlacementQueue' server.js && grep -q 'ALLOW_INTERSECTION_OFFSET:.12' server.js && grep -q 'USEFUL_CPS:16' server.js && grep -q 'PLACE_BATCH_MS=18' public/game.js && grep -q "case'placeBatchResult'" public/game.js
      - run: |
          git config user.name github-actions
          git config user.email actions@github.com
          git add server.js public/game.js public/index.html
          git diff --cached --quiet || git commit -m "Implement Blocks V5"
          git push origin HEAD:feature/blocks-v5-bridge-rewind
