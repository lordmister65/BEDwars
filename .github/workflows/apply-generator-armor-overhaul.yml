name: Apply generator armor overhaul
on:
  push:
    branches: [ feature/generator-armor-overhaul ]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/generator-armor-overhaul
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-generator-armor-overhaul.js
      - run: node --check server.js
      - run: node --check public/game.js
      - name: Commit generated overhaul
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/game.js
          git diff --cached --quiet || git commit -m "Overhaul generators drops and armor visuals"
          git push origin HEAD:feature/generator-armor-overhaul
