name: Apply Generator Balance
on:
  push:
    branches: [ map-layout-overhaul ]
    paths:
      - '.github/scripts/apply-generator-balance.js'
      - '.github/workflows/apply-generator-balance.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: map-layout-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply generator balance
        run: node .github/scripts/apply-generator-balance.js
      - name: Validate syntax
        run: node --check server.js
      - name: Commit balance update
        run: |
          rm .github/scripts/apply-generator-balance.js
          rm .github/workflows/apply-generator-balance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github
          git commit -m "Balance BedWars resource generators"
          git push origin map-layout-overhaul
