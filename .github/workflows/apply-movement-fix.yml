name: Apply movement freeze fix
on:
  push:
    branches: [ fix/movement-freeze-after-admin ]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/movement-freeze-after-admin
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-movement-freeze.js
      - run: node --check public/game.js
      - run: node --check server.js
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game.js
          git diff --cached --quiet || git commit -m "Fix player movement freeze after admin mode"
          git push origin HEAD:fix/movement-freeze-after-admin
