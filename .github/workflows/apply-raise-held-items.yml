name: Apply held item height adjustment
on:
  push:
    branches: [ fix/raise-held-items ]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/raise-held-items
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/raise-held-items.js
      - run: node --check public/game.js
      - name: Commit generated adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game.js
          git diff --cached --quiet || git commit -m "Raise first-person held item positions"
          git push origin HEAD:fix/raise-held-items
