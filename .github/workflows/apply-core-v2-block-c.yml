name: Apply Core V2 Block C
on:
  push:
    branches: [feature/core-v2-block-c]
    paths:
      - '.github/scripts/apply-core-v2-block-c.js'
      - '.github/workflows/apply-core-v2-block-c.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/core-v2-block-c
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize migration interpolation
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='.github/scripts/apply-core-v2-block-c.js';
          let s=fs.readFileSync(p,'utf8');
          s="const downtime='${downtime}';\n"+s;
          fs.writeFileSync(p,s);
          NODE
      - name: Apply Core V2 block C
        run: node .github/scripts/apply-core-v2-block-c.js
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/game.js
      - name: Validate Core V2 block C
        run: |
          grep -q 'PARTY_MATCH_ROOMS' server.js
          grep -q 'quickMatchRoom' server.js
          grep -q "m.t === 'matchmake'" server.js
          grep -q 'partyId' server.js
          grep -q "projectiles:R.projectiles.map" server.js
          grep -q 'resetMovementV2(p);recordCombatHistory' server.js
          grep -q 'function quickPlay' public/game.js
          grep -q 'function createPartyCode' public/game.js
          grep -q "mode==='matchmake'" public/game.js
          grep -q 'syncProjectiles(m.projectiles' public/game.js
          grep -q 'quickMode' public/index.html
          grep -q 'partyCode' public/index.html
          grep -q 'core-v2-block-c-20261009' public/index.html
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/game.js public/index.html
          git diff --cached --quiet || git commit -m 'Implement matchmaking party and reconnect V2'
          git push origin HEAD:feature/core-v2-block-c
