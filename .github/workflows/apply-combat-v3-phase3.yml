name: Apply Combat V3 Phase 3
on:
  push:
    branches: [feature/combat-v3-phase3]
    paths:
      - '.github/scripts/apply-combat-v3-phase3.js'
      - '.github/workflows/apply-combat-v3-phase3.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/combat-v3-phase3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize migration anchor
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const p='.github/scripts/apply-combat-v3-phase3.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('p.combatHistory=[];resetComboState(p);recordCombatHistory(p,n);','p.combatHistory=[];recordCombatHistory(p,n);');
          fs.writeFileSync(p,s);
          NODE
      - name: Apply Combat V3 phase 3
        run: node .github/scripts/apply-combat-v3-phase3.js
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/game.js
      - name: Validate Combat V3 phase 3
        run: |
          grep -q 'KB_HORIZONTAL:7.40' server.js
          grep -q 'AIR_KB_MULTIPLIER_H:.92' server.js
          grep -q 'SPRINT_KB_MULTIPLIER:1.10' server.js
          grep -q 'COMBO_KB_MIN:.90' server.js
          grep -q 'meleeKnockbackV2' server.js
          grep -q "cause==='melee'" server.js
          grep -q 'breakCombo' public/game.js
          grep -q 'combat-v3-phase3-20261008' public/index.html
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/game.js public/index.html
          git diff --cached --quiet || git commit -m 'Implement Combat V3 phase 3 knockback and combo tuning'
          git push origin HEAD:feature/combat-v3-phase3
