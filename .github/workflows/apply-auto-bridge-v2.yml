name: Apply Auto Bridge Ghost Fix V2
on:
  push:
    branches: [fix/auto-bridge-ghost-v2]
    paths:
      - '.github/scripts/fix-auto-bridge-v2.js'
      - '.github/workflows/apply-auto-bridge-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/auto-bridge-ghost-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply focused bridge fix
        run: node .github/scripts/fix-auto-bridge-v2.js
      - name: Validate JavaScript
        run: |
          node --check public/game.js
          node --check server.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/game.js public/index.html server.js
          git diff --cached --quiet || git commit -m 'Fix ghost blocks and automatic bridging'
          git push origin HEAD:fix/auto-bridge-ghost-v2
