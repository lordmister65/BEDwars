name: Apply Progression Pack V2
on:
  push:
    branches: [ feature/progression-chests-compass ]
    paths:
      - '.github/workflows/apply-progression-pack-v2.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progression-chests-compass
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply corrected progression pack
        run: node .github/scripts/apply-progression-pack.js
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Commit feature pack
        run: |
          git config user.name lordmister65
          git config user.email actions@users.noreply.github.com
          git add server.js public/game.js public/shared.js public/index.html public/style.css
          if ! git diff --cached --quiet; then
            git commit -m "Add upgrades traps chests compass XP and ranking"
            git push
          fi
