name: Apply Mobile Experience V2
on:
  push:
    branches: [feature/mobile-experience-v2]
    paths:
      - '.github/scripts/apply-mobile-experience-v2.js'
      - '.github/workflows/apply-mobile-experience-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-experience-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Mobile Experience V2
        run: node .github/scripts/apply-mobile-experience-v2.js
      - name: Validate JavaScript
        run: |
          node --check public/game.js
          node --check server.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Verify mobile-only hooks
        run: |
          grep -q 'mobile-left-handed' public/style.css
          grep -q 'bwMobilePrefs' public/game.js
          grep -q 'mobileOrientationHint' public/index.html
          grep -q 'mobile-experience-v2-20261005' public/index.html
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/game.js public/index.html public/style.css
          git diff --cached --quiet || git commit -m 'Improve mobile controls HUD shop and touch experience'
          git push origin HEAD:feature/mobile-experience-v2
