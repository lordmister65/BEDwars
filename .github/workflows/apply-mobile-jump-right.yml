name: Apply Mobile Jump Right
on:
  push:
    branches: [fix/mobile-jump-right]
    paths:
      - '.github/scripts/move-mobile-jump-right.js'
      - '.github/workflows/apply-mobile-jump-right.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-jump-right
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Move jump button
        run: node .github/scripts/move-mobile-jump-right.js
      - name: Validate
        run: |
          node --check public/game.js
          grep -q 'id="jumpPadBtn"' public/index.html
          grep -q '#mobile #jumpPadBtn' public/index.html
          test "$(grep -o 'id="jumpPadBtn"' public/index.html | wc -l)" -eq 1
      - name: Commit functional change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html
          git diff --cached --quiet || git commit -m 'Move mobile jump button to right side'
          git push origin HEAD:fix/mobile-jump-right
