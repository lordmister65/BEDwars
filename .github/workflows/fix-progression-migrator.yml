name: Fix Progression Migrator
on:
  push:
    branches: [ feature/progression-chests-compass ]
    paths:
      - '.github/scripts/fix-progression-migrator.js'
      - '.github/workflows/fix-progression-migrator.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/progression-chests-compass
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fix migrator
        run: node .github/scripts/fix-progression-migrator.js
      - name: Validate migrator syntax
        run: node --check .github/scripts/apply-progression-pack.js
      - name: Commit migrator fix
        run: |
          git config user.name lordmister65
          git config user.email actions@users.noreply.github.com
          git add .github/scripts/apply-progression-pack.js
          if ! git diff --cached --quiet; then
            git commit -m "Fix progression migration templates"
            git push
          fi
