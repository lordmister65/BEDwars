name: Reset Match Clock
on:
  push:
    branches: [ map-layout-overhaul ]
    paths:
      - '.github/scripts/reset-match-clock.js'
      - '.github/workflows/reset-match-clock.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: map-layout-overhaul
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply clock reset
        run: node .github/scripts/reset-match-clock.js
      - name: Validate syntax
        run: node --check server.js
      - name: Commit clock reset
        run: |
          rm .github/scripts/reset-match-clock.js
          rm .github/workflows/reset-match-clock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github
          git commit -m "Reset match clock when game starts"
          git push origin map-layout-overhaul
