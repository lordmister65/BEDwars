name: Apply control recovery fix
on:
  push:
    branches: [ fix/pointerlock-controls ]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pointerlock-controls
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-controls.js
      - run: node --check public/game.js
      - name: Commit generated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game.js
          git diff --cached --quiet || git commit -m "Fix pointer lock and desktop controls"
          git push origin HEAD:fix/pointerlock-controls
