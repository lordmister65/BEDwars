name: Apply Audio Volume Settings
on:
  push:
    branches: [feature/audio-volume-settings]
    paths:
      - '.github/scripts/add-audio-volume-settings.js'
      - '.github/workflows/apply-audio-volume-settings.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audio-volume-settings
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply audio settings
        run: node .github/scripts/add-audio-volume-settings.js
      - name: Validate JavaScript
        run: |
          node --check public/game.js
          node --check server.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Verify UI hooks
        run: |
          grep -q 'audioSettingsBtn' public/index.html
          grep -q 'bwGameVolume' public/game.js
          grep -q 'audioSettingsPanel' public/style.css
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/index.html public/style.css public/game.js
          git diff --cached --quiet || git commit -m 'Add adjustable game audio volume'
          git push origin HEAD:feature/audio-volume-settings
