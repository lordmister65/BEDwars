name: Apply Bed Visual
on:
  push:
    branches: [ bed-visual-model ]
    paths:
      - '.github/scripts/apply-bed-visual.js'
      - '.github/workflows/apply-bed-visual.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bed-visual-model
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply bed visual model
        run: node .github/scripts/apply-bed-visual.js
      - name: Validate syntax
        run: node --check public/game.js
      - name: Commit bed visual update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game.js
          git diff --cached --quiet || git commit -m "Add voxel bed visual model"
          git push
