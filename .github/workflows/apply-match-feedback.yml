name: Apply match feedback package
on:
  push:
    branches: [ feature/bedwars-hud-respawn-feedback ]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/bedwars-hud-respawn-feedback
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-match-feedback.js
      - run: node --check server.js
      - run: node --check public/game.js
      - name: Commit generated match feedback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/game.js public/index.html public/style.css
          git diff --cached --quiet || git commit -m "Add BedWars HUD respawn countdown and combat feedback"
          git push origin HEAD:feature/bedwars-hud-respawn-feedback
