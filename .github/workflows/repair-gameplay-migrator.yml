name: Repair Gameplay Migrator
on:
  push:
    branches: [feature/gameplay-pack-hotbar-traps]
    paths:
      - '.github/workflows/repair-gameplay-migrator.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/gameplay-pack-hotbar-traps
      - name: Repair migrator
        run: python3 .github/scripts/repair-gameplay-migrator.py
      - name: Validate migrator syntax
        run: python3 -m py_compile .github/scripts/apply-gameplay-pack.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/apply-gameplay-pack.py
          if ! git diff --cached --quiet; then
            git commit -m "Fix gameplay migration HTML injection"
            git push origin HEAD:feature/gameplay-pack-hotbar-traps
          fi
