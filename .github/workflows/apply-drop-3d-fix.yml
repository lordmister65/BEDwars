name: Apply drop 3D tick fix
on:
  push:
    branches: [ fix/drop-3d-tick-crash ]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/drop-3d-tick-crash
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fix-drop-3d-tick-crash.js
      - run: node --check public/game.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/game.js
          git diff --cached --quiet || git commit -m "Fix 3D resource drop tick crash"
          git push origin HEAD:fix/drop-3d-tick-crash
