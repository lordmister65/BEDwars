name: Apply Stability Performance Pack
on:
  push:
    branches: [feature/stability-performance-pack]
    paths:
      - '.github/scripts/apply-stability-performance-pack.js'
      - '.github/workflows/apply-stability-performance-pack.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/stability-performance-pack
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node .github/scripts/apply-stability-performance-pack.js
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/game.js public/style.css public/index.html
          git diff --cached --quiet || git commit -m "Stability and performance pack"
          git push origin HEAD:feature/stability-performance-pack
