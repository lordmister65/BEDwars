name: Apply Security Multiplayer Polish
on:
  push:
    branches: [feature/security-multiplayer-polish]
    paths:
      - '.github/scripts/apply-security-multiplayer-polish.js'
      - '.github/workflows/apply-security-multiplayer-polish.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/security-multiplayer-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch migration compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/apply-security-multiplayer-polish.js')
          s=p.read_text()
          s=s.replace("let dropVisualAt=0,dropVisualDisabled=false;function updateDropVisuals(now){if(dropVisualDisabled||now-dropVisualAt<33)return;","let dropVisualAt=0,dropVisualDisabled=false;function updateDropVisuals(now){if(dropVisualDisabled||now-dropVisualAt<(lowEnd?66:33))return;")
          p.write_text(s)
          PY
      - name: Apply migration
        run: node .github/scripts/apply-security-multiplayer-polish.js
      - name: Validate syntax
        run: |
          node --check server.js
          node --check public/game.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js public/game.js public/style.css public/index.html
          git diff --cached --quiet || git commit -m "Security and multiplayer polish pack"
          git push origin HEAD:feature/security-multiplayer-polish
