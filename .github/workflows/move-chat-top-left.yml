name: Move Chat Top Left
on:
  push:
    branches: [fix/chat-top-left]
    paths:
      - '.github/scripts/move-chat-top-left.js'
      - '.github/workflows/move-chat-top-left.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chat-top-left
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply migration
        run: node .github/scripts/move-chat-top-left.js
      - name: Validate syntax
        run: |
          node --check public/game.js
          node --check server.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/style.css public/index.html
          git diff --cached --quiet || git commit -m "Move chat to upper left"
          git push origin HEAD:fix/chat-top-left
