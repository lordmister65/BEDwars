name: Polish Maps V3 FFA8
on:
  push:
    branches: [feature/maps-v3-ffa8]
    paths:
      - '.github/scripts/polish-maps-v3-ffa8.py'
      - '.github/workflows/polish-maps-v3-ffa8.yml'
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maps-v3-ffa8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply polish
        run: python3 .github/scripts/polish-maps-v3-ffa8.py
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/shared.js
          node --check public/game.js
      - name: Validate polish
        run: |
          grep -q "J_BASES=\[\[0,126\]" public/shared.js
          grep -q 'ADMIN_BLOCK_MAX=42' server.js
          grep -q 'visualTeamActive' public/game.js
          grep -q 'Cama Ciano' public/game.js
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/shared.js public/game.js
          git diff --cached --quiet || git commit -m 'Polish FFA8 map spacing and active base visuals'
          git push origin HEAD:feature/maps-v3-ffa8
