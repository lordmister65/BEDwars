name: Apply Minecraft Mobile Controls
on:
  push:
    branches: [feature/mobile-minecraft-controls-final]
    paths:
      - '.github/scripts/apply-mobile-minecraft-controls.js'
      - '.github/workflows/apply-mobile-minecraft-controls.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mobile-minecraft-controls-final
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Minecraft-style controls
        run: node .github/scripts/apply-mobile-minecraft-controls.js
      - name: Validate JavaScript
        run: |
          node --check public/game.js
          node --check server.js
          node --check public/shared.js
      - name: Install dependencies
        run: npm ci
      - name: Verify mobile control hooks
        run: |
          grep -q 'moveForwardBtn' public/index.html
          grep -q 'screenTapAction' public/game.js
          grep -q 'Minecraft-style mobile controls' public/style.css
          grep -q 'mobile-minecraft-controls-20261005' public/index.html
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189824+github-actions[bot]@users.noreply.github.com'
          git add public/game.js public/index.html public/style.css
          git diff --cached --quiet || git commit -m 'Replace mobile joystick with Minecraft-style touch controls'
          git push origin HEAD:feature/mobile-minecraft-controls-final
