name: Apply Core V2 Block B
on:
  push:
    branches: [feature/core-v2-block-b]
    paths:
      - '.github/scripts/apply-core-v2-block-b.js'
      - '.github/workflows/apply-core-v2-block-b.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/core-v2-block-b
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Core V2 block B
        run: node .github/scripts/apply-core-v2-block-b.js
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/game.js
      - name: Validate Core V2 block B
        run: |
          grep -q 'BLOCKS_V4' server.js
          grep -q 'PROJECTILE_V2' server.js
          grep -q 'lagCompMs' server.js
          grep -q 'interpolatedCombatState(q,targetTime)' server.js
          grep -q 'blockOpSeq' public/game.js
          grep -q 'opSeq' public/game.js
          grep -q 'combatNetRttMs' public/game.js
          grep -q 'core-v2-block-b-20261009' public/index.html
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/game.js public/index.html
          git diff --cached --quiet || git commit -m 'Implement Blocks V4 reconciliation and Projectile V2 lag compensation'
          git push origin HEAD:feature/core-v2-block-b
