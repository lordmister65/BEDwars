name: Apply Maps V3 FFA8
on:
  push:
    branches: [feature/maps-v3-ffa8]
    paths:
      - '.github/scripts/apply-maps-v3-ffa8.py'
      - '.github/workflows/apply-maps-v3-ffa8.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/maps-v3-ffa8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Maps V3 migration
        run: python3 .github/scripts/apply-maps-v3-ffa8.py
      - name: Install dependencies
        run: npm ci
      - name: Validate JavaScript
        run: |
          node --check server.js
          node --check public/shared.js
          node --check public/game.js
      - name: Validate FFA8 and maps
        run: |
          grep -q "maxPlayers:8" server.js
          grep -q "activeTeams:\[0,1,2,3,4,5,6,7\]" server.js
          grep -q 'TEAM_BED_BLOCKS' public/shared.js
          grep -q 'TEAM_WOOL_BLOCKS' public/shared.js
          grep -q 'SIDE_ISLANDS' public/shared.js
          grep -q 'J_BASES=\[\[0,108\]' public/shared.js
          grep -q 'Maps V3 / FFA 8' public/style.css
          grep -q 'maps-v3-ffa8-20261009' public/index.html
      - name: Commit functional changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js public/shared.js public/game.js public/index.html public/style.css
          git diff --cached --quiet || git commit -m 'Expand FFA to 8 and improve map islands'
          git push origin HEAD:feature/maps-v3-ffa8
